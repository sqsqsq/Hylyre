name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: CLI smoke
        run: hylyre doctor
      - name: Pytest
        run: pytest --cov=hylyre --cov-fail-under=70

  build-wheel:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev)
        run: pip install -e ".[dev]"
      - name: Packaging tests (slow)
        run: pytest tests/packaging -m slow -q
      - name: Build vendor wheel
        run: python scripts/build_wheel.py --clean
      - name: Verify manifest
        run: python scripts/build_wheel.py --verify dist/release
      - name: Build plain-source release
        run: python scripts/build_wheel.py --source --clean
      - name: Verify source manifest
        run: python scripts/build_wheel.py --verify dist/release-src
