name: compat-framework

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  mirror:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hylyre (editable, for progress append helpers)
        run: pip install -e "."
      - name: Soft schema mirror vs SimulatedWalletForHmos trace.schema.json
        run: python scripts/check_framework_schema.py
